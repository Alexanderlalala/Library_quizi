{% extends 'base.html' %}

{% block content %}
    <h2>List of books</h2>
    <ul>
        {% for book in books %}
            <li>
                {{ book.title }} – {{ book.pages }} pages:
                {% if book.pages > 300 %}
                    this is a long book
                {% else %}
                    this is a small book
                {% endif %}
            </li>
        {% endfor %}
    </ul>
    <a href="{% url 'home' %}">Main page</a>
{% endblock %}
